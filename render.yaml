services:
  - type: web
    name: pennywise-for-paypal
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:web
    startCommand: npm start
    healthCheckPath: /healthz
    # Keeps the Merchant fairness ledger across restarts and deploys.
    disk:
      name: pennywise-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: AUTHZ_HMAC_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
